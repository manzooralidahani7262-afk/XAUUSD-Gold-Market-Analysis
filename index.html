<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gold Trading Signals</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(
        circle at top,
        #1e3a5f 0%,
        #0b1220 48%,
        #050914 100%
      );
      color: #ffffff;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px 24px 30px;
      text-align: center;
      background: rgba(20, 34, 55, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    /* Gold Trading Profile */
    .profile {
      width: 105px;
      height: 105px;
      margin: 0 auto 18px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        145deg,
        #ffd54a,
        #d99100
      );

      border: 5px solid rgba(255,255,255,0.92);

      box-shadow:
        0 8px 30px rgba(255,183,0,0.28);

      font-size: 27px;
      font-weight: 900;
      color: #111827;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 800;
    }

    .subtitle {
      margin: 10px 0 24px;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 15px;
      border-radius: 30px;

      background: rgba(34,197,94,0.12);
      color: #4ade80;

      font-size: 14px;
      font-weight: 700;
    }

    .button {
      display: block;
      width: 100%;

      padding: 18px 16px;
      margin: 15px 0;

      border-radius: 15px;
      text-decoration: none;

      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.3px;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* Free Signal Button */
    .free {
      background: linear-gradient(
        135deg,
        #22c55e,
        #16a34a
      );

      color: white;

      box-shadow:
        0 8px 22px rgba(34,197,94,0.20);
    }

    /* VIP Button */
    .vip {
      background: linear-gradient(
        135deg,
        #ffd54a,
        #f59e0b
      );

      color: #111827;

      box-shadow:
        0 8px 22px rgba(245,158,11,0.20);
    }

    .note {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Profile -->
    <div class="profile">
      XAU
    </div>

    <!-- Title -->
    <h1>
      Gold Trading Signals
    </h1>

    <!-- Description -->
    <div class="subtitle">
      Daily Gold Signals & Market Updates
    </div>

    <!-- Channel Focus -->
    <div class="tag">
      🟢 JOIN OUR TELEGRAM CHANNEL
    </div>

    <!-- FREE SIGNAL -->
    <a
      class="button free"
      href="https://t.me/+sm8JVKn-y7plMmZk"
      target="_blank"
      rel="noopener">
      JOIN FREE SIGNAL
    </a>

    <!-- VIP -->
    <a
      class="button vip"
      href="https://t.me/+sm8JVKn-y7plMmZk"
      target="_blank"
      rel="noopener">
      JOIN VIP
    </a>

    <div class="note">
      Tap a button to open our Telegram channel.
    </div>

  </div>

</body>
</html>
