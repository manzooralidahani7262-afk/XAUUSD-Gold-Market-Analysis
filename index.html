<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gold Trading Signals</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #244b70 0%,
          #0b1628 55%,
          #050914 100%
        );

      color: white;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 32px 24px;

      text-align: center;

      background: #182a40;

      border-radius: 28px;

      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .logo {
      width: 105px;
      height: 105px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: linear-gradient(
        145deg,
        #ffe066,
        #d99600
      );

      border: 5px solid white;

      color: #111827;

      font-size: 27px;
      font-weight: 900;

      box-shadow:
        0 8px 30px rgba(255,190,0,0.30);
    }

    h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin: 10px 0 25px;

      color: #cbd5e1;

      font-size: 16px;
      line-height: 1.5;
    }

    .button {
      display: block;

      width: 100%;

      padding: 18px;

      margin: 15px 0;

      border: none;

      border-radius: 15px;

      text-decoration: none;

      font-size: 19px;
      font-weight: 800;

      cursor: pointer;
    }

    .free {
      background: linear-gradient(
        135deg,
        #22c55e,
        #16a34a
      );

      color: white;
    }

    .vip {
      background: linear-gradient(
        135deg,
        #ffd84d,
        #f59e0b
      );

      color: #111827;
    }

    .note {
      margin-top: 18px;

      color: #94a3b8;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      XAU
    </div>

    <h1>
      Gold Trading Signals
    </h1>

    <div class="subtitle">
      Daily XAUUSD Gold Signals & Market Updates
    </div>

    <!-- FREE SIGNALS -->
    <button
      class="button free"
      onclick="joinChannel()">
      JOIN FREE SIGNALS
    </button>

    <!-- VIP -->
    <button
      class="button vip"
      onclick="joinChannel()">
      JOIN VIP
    </button>

    <div class="note">
      Join our official Telegram channel
    </div>

  </div>

  <script>
    const CHANNEL_LINK =
      "https://t.me/+sm8JVKn-y7plMmZk";

    function joinChannel() {

      if (
        window.Telegram &&
        Telegram.WebApp &&
        Telegram.WebApp.openTelegramLink
      ) {

        Telegram.WebApp.openTelegramLink(
          CHANNEL_LINK
        );

      } else {

        window.location.href =
          CHANNEL_LINK;

      }
    }

    if (
      window.Telegram &&
      Telegram.WebApp
    ) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>

</body>
</html>
