<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Telegram Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Green Pips Trading View</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: #fff;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 620px;
}

.card {
    width: 100%;
    padding: 42px 28px 34px;
    text-align: center;
    background: linear-gradient(145deg, #111111, #070707);
    border: 2px solid #ffd400;
    border-radius: 30px;
    box-shadow: 0 0 35px rgba(255,212,0,.18);
}

.logo {
    width: 125px;
    height: 125px;
    margin: 0 auto 25px;
    border-radius: 50%;
    background: #ffd400;
    color: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    font-weight: 800;
}

h1 {
    margin: 0 0 12px;
    color: #ffd400;
    font-size: 30px;
    line-height: 1.2;
}

.live {
    color: #00f58b;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 25px;
}

.description {
    color: #eee;
    font-size: 19px;
    line-height: 1.7;
    margin-bottom: 28px;
}

.features {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.feature {
    flex: 1;
    padding: 15px 8px;
    background: #0d0d0d;
    border: 1px solid #292929;
    border-radius: 15px;
}

.feature strong {
    display: block;
    color: #fff;
    font-size: 17px;
}

.feature span {
    display: block;
    color: #999;
    font-size: 12px;
    margin-top: 5px;
}

/* ONE BUTTON */

.join-button {
    display: block;
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(90deg, #ffd400, #ff9800);
    color: #050505;
    font-size: 21px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,180,0,.20);
}

.footer {
    margin-top: 24px;
    color: #666;
    font-size: 13px;
}

@media (max-width: 480px) {

    .card {
        padding: 32px 18px 28px;
    }

    .logo {
        width: 105px;
        height: 105px;
        font-size: 47px;
    }

    h1 {
        font-size: 26px;
    }

    .description {
        font-size: 17px;
    }

    .join-button {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
GP
</div>

<h1>
GREEN PIPS TRADING VIEW
</h1>

<div class="live">
● LIVE GOLD EXPERT
</div>

<div class="description">
Professional XAUUSD Gold Analysis<br>
Daily Free Gold Signals<br>
Clear Entry • TP • SL Levels
</div>

<div class="features">

<div class="feature">
<strong>Daily</strong>
<span>Gold Signals</span>
</div>

<div class="feature">
<strong>XAUUSD</strong>
<span>Market Focus</span>
</div>

<div class="feature">
<strong>Clear</strong>
<span>Trade Levels</span>
</div>

</div>


<!-- DIRECT TELEGRAM CHANNEL BUTTON -->

<button
class="join-button"
type="button"
id="joinChannel">

🔥 JOIN FREE GOLD SIGNALS

</button>


<div class="footer">

XAUUSD | GBPUSD | BTCUSD • Official Channel

</div>

</div>
</div>


<script>

const CHANNEL_LINK =
"https://t.me/+1sCa0ZGIIRtjNmJk";

const button =
document.getElementById("joinChannel");

button.addEventListener("click", function () {

    if (
        window.Telegram &&
        window.Telegram.WebApp &&
        typeof window.Telegram.WebApp.openTelegramLink === "function"
    ) {

        Telegram.WebApp.openTelegramLink(
            CHANNEL_LINK
        );

    } else {

        window.location.href =
            CHANNEL_LINK;

    }

});

</script>

</body>
</html>
