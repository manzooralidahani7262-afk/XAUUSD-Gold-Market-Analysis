<!DOCTYPE html>
<html lang="en">
<head>

    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gold Trading Signals</title>

  <!-- Open App کھلنے کے بعد Channel پر redirect -->
  <meta
    http-equiv="refresh"
    content="0;url=https://t.me/+sm8JVKn-y7plMmZk"

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #23466b 0%,
          #0d1728 50%,
          #050914 100%
        );

      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 35px 25px;

      text-align: center;

      background: #18283d;

      border-radius: 25px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
    }

    .profile {
      width: 100px;
      height: 100px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #ffd84d,
          #e39a00
        );

      border: 5px solid white;

      color: #111827;

      font-size: 25px;
      font-weight: 900;

      box-shadow:
        0 8px 30px rgba(255,190,0,0.3);
    }

    h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 800;
    }

    p {
      margin: 12px 0 25px;

      color: #cbd5e1;

      font-size: 16px;
    }

    .join {
      display: block;

      width: 100%;

      padding: 18px;

      margin-top: 15px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #22c55e,
          #16a34a
        );

      color: white;

      text-decoration: none;

      font-size: 19px;
      font-weight: 800;
    }

    .small {
      margin-top: 18px;

      color: #94a3b8;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="profile">
      XAU
    </div>

    <h1>
      Gold Trading Signals
    </h1>

    <p>
      Daily XAUUSD Gold Signals & Market Updates
    </p>

    <a
      class="join"
      href="https://t.me/+sm8JVKn-y7plMmZk"
    >
      JOIN FREE SIGNAL
    </a>

    <div class="small">
      Opening our Telegram channel...
    </div>

</html>
