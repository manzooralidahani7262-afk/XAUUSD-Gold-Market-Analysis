<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gold Signals</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #24486d 0%,
          #0b1424 55%,
          #050914 100%
        );

      color: white;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 35px 25px;

      text-align: center;

      background: #18283d;

      border-radius: 28px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
    }

    .logo {
      width: 105px;
      height: 105px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #ffd84d,
          #e39a00
        );

      border: 5px solid white;

      color: #111827;

      font-size: 26px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 29px;
    }

    p {
      margin: 12px 0 28px;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.5;
    }

    .join {
      display: block;

      width: 100%;

      padding: 18px;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #22c55e,
          #16a34a
        );

      color: white;

      text-decoration: none;

      font-size: 19px;
      font-weight: 800;

      box-shadow:
        0 8px 25px rgba(34,197,94,0.25);
    }

    .note {
      margin-top: 18px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      XAU
    </div>

    <h1>
      Gold Trading Signals
    </h1>

    <p>
      Daily XAUUSD Gold Signals & Market Updates
    </p>

    <a
      class="join"
      href="https://t.me/+sm8JVKn-y7plMmZk"
      target="_blank"
      rel="noopener">
      JOIN FREE SIGNAL
    </a>

    <div class="note">
      Join our official Telegram channel
    </div>

  </div>

</body>
</html>
