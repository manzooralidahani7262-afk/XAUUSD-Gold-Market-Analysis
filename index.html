<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gold Market Analysis</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #3b2b00 0%, #111111 45%, #050505 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(145deg, #ffd700, #a87500);
      border: 4px solid #f5c542;

      box-shadow:
        0 0 25px rgba(255, 215, 0, 0.45),
        inset 0 0 15px rgba(255,255,255,0.25);

      font-size: 42px;
      font-weight: 900;
      color: #111;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffd700;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 15px;
      color: #d8d8d8;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 20px;
      padding: 25px 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px 15px;
      margin-top: 15px;

      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;

      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .button:active {
      transform: scale(0.97);
    }

    .free {
      background: linear-gradient(135deg, #ffd700, #c99400);
      color: #111;
    }

    .vip {
      background: linear-gradient(135deg, #ffffff, #cfcfcf);
      color: #111;
    }

    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">XAU</div>

    <h1>GOLD MARKET ANALYSIS</h1>

    <div class="subtitle">
      XAUUSD Gold Signals & Market Analysis
    </div>

    <div class="card">

      <button
        class="button free"
        onclick="joinChannel()">
        🟢 JOIN FREE SIGNALS
      </button>

      <button
        class="button vip"
        onclick="joinChannel()">
        ⭐ JOIN VIP
      </button>

    </div>

    <div class="footer">
      XAUUSD • Gold Trading • Market Analysis
    </div>

  </div>

  <script>

    const CHANNEL_LINK =
      "https://t.me/+sm8JVKn-y7plMmZk";

    function joinChannel() {

      if (
        window.Telegram &&
        Telegram.WebApp
      ) {

        Telegram.WebApp.openTelegramLink(
          CHANNEL_LINK
        );

      } else {

        window.location.href =
          CHANNEL_LINK;

      }
    }

    if (
      window.Telegram &&
      Telegram.WebApp
    ) {

      Telegram.WebApp.ready();

      Telegram.WebApp.expand();
    }

  </script>

</body>
</html>
