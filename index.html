<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Trading</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: #1e293b;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      padding: 16px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    .free {
      background: #22c55e;
      color: white;
    }

    .vip {
      background: #f59e0b;
      color: #111827;
    }

    .bot {
      background: #229ed9;
      color: white;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Telegram Trading</h1>

    <p>Join our Telegram community</p>

    <!-- FREE SIGNAL -->
    <a
      class="button free"
      href="https://t.me/+sm8JVKn-y7plMmZk"
      target="_blank">
      JOIN FREE SIGNAL
    </a>

    <!-- VIP -->
    <a
      class="button vip"
      href="https://t.me/mansoorali122bot"
      target="_blank">
      JOIN VIP
    </a>

    <!-- BOT -->
    <a
      class="button bot"
      href="https://t.me/mansoorali122bot"
      target="_blank">
      OPEN BOT
    </a>

  </div>

</body>
</html>
