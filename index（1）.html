<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>XAUUSD Gold Market Analysis</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f14;
    }
    #app {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0b0f14;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="loading">Loading XAUUSD App…</div>

  <iframe
    id="app"
    title="XAUUSD Gold Market Analysis"
    src="https://manzooralidahani7262-afk.github.io/XAUUSD-Gold-Market-Analysis/"
    allow="clipboard-read; clipboard-write"
    loading="eager">
  </iframe>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Match Telegram's current theme where supported.
      document.documentElement.style.setProperty(
        "--tg-bg",
        tg.themeParams && tg.themeParams.bg_color
          ? tg.themeParams.bg_color
          : "#0b0f14"
      );

      // Hide the loader once Telegram has initialized.
      document.getElementById("loading").style.display = "none";
    } else {
      // The page can still be opened normally outside Telegram.
      document.getElementById("loading").style.display = "none";
    }
  </script>
</body>
</html>
